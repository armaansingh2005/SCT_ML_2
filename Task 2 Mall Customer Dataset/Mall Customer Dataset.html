<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>K-Means Customer Segmentation</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}


body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(
    135deg,
    #667eea,
    #764ba2
    );

}



.container{

    width:450px;

    background:white;

    padding:30px;

    border-radius:25px;


    box-shadow:
    0 20px 50px
    rgba(0,0,0,.4);


    animation:show .7s ease;

}



@keyframes show{

from{

opacity:0;
transform:scale(.5);

}

to{

opacity:1;
transform:scale(1);

}

}



h1{

text-align:center;

margin-bottom:20px;

}



input{

width:100%;

padding:12px;

margin:10px 0;

border-radius:10px;

border:1px solid #aaa;

}



button{

width:100%;

padding:15px;

border:none;

border-radius:20px;

background:#667eea;

color:white;

font-size:18px;

cursor:pointer;

transition:.3s;

}



button:hover{

transform:scale(1.05);

background:#764ba2;

}



.result{

margin-top:20px;

padding:20px;

background:#eee;

border-radius:15px;

text-align:center;

animation:fade .5s ease;

}



@keyframes fade{

from{
opacity:0;
}

to{
opacity:1;
}

}



.cluster{

font-size:25px;

font-weight:bold;

color:#667eea;

}



</style>

</head>




<body>


<div class="container">


<h1>🛒 Customer Segmentation</h1>


<input 
type="number"
id="spending"
placeholder="Annual Spending ($)">



<input
type="number"
id="purchases"
placeholder="Number of Purchases">



<input
type="number"
id="visits"
placeholder="Monthly Store Visits">



<button onclick="clusterCustomer()">

Find Customer Cluster

</button>



<div id="output"></div>


</div>








<script>


// Sample K-Means trained centroids
// based on purchase history


let centroids=[


{
name:"Low Value Customer",
data:[1000,10,2]
},



{
name:"Regular Customer",
data:[10000,50,8]
},



{
name:"Premium Customer",
data:[50000,150,20]
}


];




// Euclidean Distance Function


function distance(a,b){


return Math.sqrt(


Math.pow(a[0]-b[0],2)

+

Math.pow(a[1]-b[1],2)

+

Math.pow(a[2]-b[2],2)


);


}









function clusterCustomer(){



let spending =
Number(
document.getElementById("spending").value
);



let purchases =
Number(
document.getElementById("purchases").value
);



let visits =
Number(
document.getElementById("visits").value
);




if(

!spending ||

!purchases ||

!visits

){

alert("Enter all customer details");

return;

}




let customer=[

spending,

purchases,

visits

];





let nearest;

let minDistance=Infinity;





centroids.forEach(cluster=>{


let d =
distance(

customer,

cluster.data

);



if(d < minDistance){


minDistance=d;


nearest=cluster.name;


}



});






showResult(
nearest,
minDistance
);



}








function showResult(
cluster,
distance
){



document.getElementById("output")
.innerHTML=

`

<div class="result">


<h2>Customer Group</h2>


<p class="cluster">

${cluster}

</p>


<p>

Distance Score:
${distance.toFixed(2)}

</p>


</div>

`;


}




</script>


</body>

</html>
